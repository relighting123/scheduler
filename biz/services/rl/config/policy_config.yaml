# Scheduler RL: observation normalization and reward weights.
# Edit this file to tune state/reward without changing simulation code.

observation:
  wip_scale: 1000.0
  eqp_scale: 100.0
  st_scale: 60.0
  plan_scale: 1000.0
  bias_feature: 1.0

reward:
  transfer_penalty_per_unit: 0.002
  guidance_improvement_weight: 0.5
  terminal_bonus:
    achievement_0_99: 1.5
    achievement_0_90: 0.8
    achievement_0_80: 0.4
    achievement_0_60: 0.1
